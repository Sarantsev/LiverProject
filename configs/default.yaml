project:
  name: liver-sppvr
  seed: 2023                          # ONE seed for every pipeline -> identical patient folds

device: auto                          # auto | cuda | cpu

# --- Data ---
data:
  manifest: "data/manifest.csv"       # image_path, mask_path, tumor_type, dataset, phase, patient_id
  clinical_csv: ""                    # scripts/build_clinical.py -> 5 objective features; "" = image-only
  pred_masks_csv: ""                  # Stage A out-of-fold nnU-Net masks: patient_id, pred_mask_path

# --- Multi-phase CT ---
multiphase:
  phases: [non_contrast, arterial, portal, delayed]
  fusion: attention                   # attention | cross_attention | concat_stem

# --- Region of interest fed to the classifier (one box per patient, all phases + mask) ---
preprocess:
  roi: body                           # none | body (intensity crop, SegVol CropForeground) |
                                      # pred (crop around the PREDICTED mask -> tumour fills the window;
                                      #       never derived from GT)
  roi_margin: 0.5                     # context around the tumour for roi=pred (fraction of extent)

# --- Classifier (ours) ---
classifier:
  backbone: segvol                    # segvol | merlin -- two pretrained CT encoders compared head-to-head
  finetune: dora                      # segvol: dora | lora | frozen | full   merlin: partial | frozen | full
  mask_source: pred                   # none (GAP, image-only) | gt (semi-auto upper bound) | pred (fully-auto)
  num_classes: 5
  class_names: [HCC, ICC, CRLM, BCLM, HH]
  hidden_dim: 256
  dropout: 0.3

# --- Backbones ---
segvol:                               # BAAI/SegVol ViT-B via HF (trust_remote_code); image encoder only
  spatial_size: [32, 256, 256]        # fixed by the pretrained positional embeddings
  patch_size: [4, 16, 16]
  embed_dim: 768
  normalize: foreground               # SegVol ForegroundNorm z-score (what the encoder was pretrained on)
  hu_window: [-175, 250]              # only used when normalize=hu
  lora:
    rank: 16
    alpha: 32                         # keep alpha = 2*rank
    dropout: 0.05
    targets: [qkv, out_proj, linear1, linear2]   # attention + MLP; expect "DORA: wrapped ~48"
merlin:                               # Stanford Merlin I3D-ResNet-152; weights from HF stanfordmimi/Merlin
  spatial_size: [160, 224, 224]       # (D,H,W) window at fixed spacing (zero pad / crop), as pretrained
  spacing: [3.0, 1.5, 1.5]            # (D,H,W) mm: 3 mm slices / 1.5 mm in-plane, as pretrained
  hu_window: [-1000, 1000]            # HU -> [0,1], as pretrained
  features: contrastive               # contrastive (512-d CLIP-projected map) | layer4 (2048-d)
  partial_targets: [layer4.2, contrastive_head]  # finetune=partial: which params to unfreeze.
                                      # Capacity, not depth, is the binding constraint here: only 412
                                      # training patients per fold, and on this data a reduced-capacity
                                      # DoRA already matched the full one. Trainable params per choice:
                                      #   [contrastive_head]            1.0M  (closest to DoRA's 2.44M)
                                      #   [layer4.2, contrastive_head] 10.2M  (default)
                                      #   [layer4, contrastive_head]   30.2M  (12x SegVol -> overfit risk)
  checkpoint: ""                      # optional local .pt (else auto-download from HF)

# --- Training ---
train:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  warmup_epoch: 10
  num_epochs: 80
  batch_size: 2
  num_workers: 8
  amp: true
  augment: true                       # flips + intensity jitter on train
  early_stop_patience: 20
  focal_gamma: 2.0
  mask_noise: 0.5                     # p(perturb the mask) on train when mask_source != none
  supcon: 0.0                         # supervised-contrastive weight (0 = off; 0.1-0.3 helped before)
  supcon_temp: 0.1
  supcon_queue: 512
